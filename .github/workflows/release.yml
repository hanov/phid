name: Release

on:
  push:
    tags: ['v*']

jobs:
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: phid-macos-arm64
          path: dist/
        continue-on-error: true   # build workflow may not have run yet

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/phid
            dist/phid.sha256
            dist/phid-*-source.tar.gz
