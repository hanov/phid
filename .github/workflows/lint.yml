name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ruff:
    name: ruff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install development tools
        run: pip install -e '.[dev]'

      - name: Lint
        run: python -m ruff check phi_security/ tests/

      - name: Format check
        run: python -m ruff format --check phi_security/ tests/
