name: Build Binary

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS Apple Silicon binary
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[databases]' 'pyinstaller>=6,<7'

      - name: Build phid binary
        run: python packaging/build_binary.py

      - name: Smoke-test binary
        run: python packaging/smoke_binary.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phid-macos-arm64
          path: |
            dist/phid
            dist/phid.sha256
          retention-days: 30
